<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fond sombre -->
  <rect width="100" height="100" rx="18" fill="#080f1e"/>
  <!-- Arc supérieur -->
  <path d="M15 38 Q50 5 85 38" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Arc inférieur -->
  <path d="M22 68 Q50 88 78 68" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Corps phare -->
  <polygon points="42,72 58,72 55,42 45,42" fill="white"/>
  <!-- Bande diagonale phare -->
  <polygon points="45,42 55,42 53,58 44,65" fill="#080f1e" opacity="0.5"/>
  <!-- Lanterne du phare -->
  <rect x="43" y="36" width="14" height="8" rx="2" fill="white"/>
  <rect x="45" y="33" width="10" height="5" rx="1" fill="white"/>
  <!-- Toit phare -->
  <polygon points="50,28 41,35 59,35" fill="white"/>
  <!-- Lumière rayonnante -->
  <line x1="50" y1="31" x2="50" y2="20" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="50" y1="31" x2="62" y2="24" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="50" y1="31" x2="38" y2="24" stroke="white" stroke-width="2" opacity="0.5"/>
</svg>
