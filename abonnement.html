<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès Podcasts Premium</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px 40px;
      max-width: 560px;
      width: 100%;
    }

    /* Le lecteur s'affiche en grand format, sur (quasi) toute la largeur de la page */
    #player-area.card {
      max-width: 1200px;
      padding: 40px 32px;
    }

    .logo {
      text-align: center;
      font-size: 40px;
      margin-bottom: 24px;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 15px;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    input[type="email"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
      color: #111827;
    }

    input[type="email"]:focus {
      border-color: #1a1a2e;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: #1a1a2e;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button:hover:not(:disabled) {
      background: #2d2d4e;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    #message.error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      display: block;
    }

    #message.info {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #player-area {
      display: none;
    }

    #player-area h2 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    #player-area .welcome {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .player-wrapper {
      border-radius: 12px;
      overflow: hidden;
      background: #f9fafb;
    }

    .logout-btn {
      width: auto;
      margin-top: 20px;
      padding: 10px 20px;
      background: transparent;
      color: #6b7280;
      border: 1.5px solid #d1d5db;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
    }

    .logout-btn:hover {
      background: #f9fafb;
      color: #374151;
    }
  </style>
<script type="application/ld+json">
{
"@context": "https://schema.org",
"@graph": [
{
"@type": "Organization",
"@id": "https://www.timeline-story.fr/#org",
"name": "Timeline Story",
"url": "https://www.timeline-story.fr/",
"foundingDate": "2012",
"founder": { "@id": "https://www.timeline-story.fr/#fremder" },
"sameAs": [
"https://www.youtube.com/@TimelineStory2026",
"https://www.facebook.com/TimelineHistoire",
"https://www.instagram.com/timelinestory2026",
"https://x.com/TimelineStory",
"https://www.twitch.tv/timeline_podcast",
"https://podcasts.apple.com/fr/podcast/id524299145",
"https://open.spotify.com/show/4yRHe5RybxcddGKnVzODQN",
"https://thestorycast.fr/"
]
},
{
"@type": "Person",
"@id": "https://www.timeline-story.fr/#fremder",
"name": "Richard Fremder",
"jobTitle": "Historien, fondateur de Timeline",
"worksFor": { "@id": "https://www.timeline-story.fr/#org" }
},
{
"@type": "PodcastSeries",
"name": "Timeline, 5000 ans d'Histoire",
"url": "https://www.timeline-story.fr/podcasts.html",
"inLanguage": "fr",
"publisher": { "@id": "https://www.timeline-story.fr/#org" },
"webFeed": "https://feeds.audiomeans.fr/feed/b4de9333-deb0-4c99-82e3-3c21cfac3f2a.xml"
}
]
}
</script>
</head>
<body>

  <!-- Formulaire de vérification -->
  <div class="card" id="gate">
    <div class="logo">🎙️</div>
    <h1>Espace Podcasts Premium</h1>
    <p class="subtitle">
      Saisissez l'adresse email associée à votre abonnement pour accéder à vos podcasts.
    </p>

    <label for="email-input">Adresse email</label>
    <input
      type="email"
      id="email-input"
      placeholder="votre@email.com"
      autocomplete="email"
    />

    <button id="verify-btn" onclick="verifyEmail()">
      Accéder à mes podcasts
    </button>

    <div id="message"></div>
  </div>

  <!-- Lecteur — affiché après vérification -->
  <div class="card" id="player-area">
    <h2>🎧 Vos Podcasts Premium</h2>
    <p class="welcome" id="welcome-text">Bienvenue ! Votre accès est confirmé.</p>

    <div class="player-wrapper">
      <iframe
        id="audiomeans-player"
        style="margin: auto; min-width: 320px; width: 100%; border: 0; display: block; height: 80vh; min-height: 600px; max-height: 900px;"
        src=""
        allow="clipboard-write; autoplay">
      </iframe>
    </div>

    <button class="logout-btn" onclick="logout()">
      ← Se déconnecter
    </button>
  </div>

  <script>
    const AUDIOMEANS_EMBED_URL = 'https://player.audiomeans.fr/player-v2/5000-ans-dhistoire-premium-98a06fbd/playlist/last?mp=1&leadin=1&embed=0&download=0&std=0&vert=0&playlist=1&color=7d7d7d&theme=dark';
    const SESSION_KEY = 'podcast_premium_access';
    const SESSION_DURATION_HOURS = 24;

    // Vérifie si une session valide existe déjà
    (function checkExistingSession() {
      const stored = localStorage.getItem(SESSION_KEY);
      if (!stored) return;
      try {
        const { email, expires } = JSON.parse(stored);
        if (Date.now() < expires) {
          showPlayer(email);
        } else {
          localStorage.removeItem(SESSION_KEY);
        }
      } catch {
        localStorage.removeItem(SESSION_KEY);
      }
    })();

    async function verifyEmail() {
      const emailInput = document.getElementById('email-input');
      const btn = document.getElementById('verify-btn');
      const msg = document.getElementById('message');
      const email = emailInput.value.trim().toLowerCase();

      msg.className = '';
      msg.style.display = 'none';
      msg.textContent = '';

      if (!email || !email.includes('@')) {
        showMessage('Veuillez saisir une adresse email valide.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Vérification…';

      try {
        const res = await fetch('/api/check-subscriber', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        if (!res.ok) throw new Error('Erreur serveur');
        const data = await res.json();

        if (data.active) {
          // Sauvegarde la session pour 24h
          const session = {
            email,
            expires: Date.now() + SESSION_DURATION_HOURS * 60 * 60 * 1000
          };
          localStorage.setItem(SESSION_KEY, JSON.stringify(session));
          showPlayer(email);
        } else {
          showMessage('❌ Aucun abonnement actif trouvé pour cet email. Vérifiez l\'adresse ou contactez le support.', 'error');
        }
      } catch (err) {
        showMessage('⚠️ Erreur de connexion. Veuillez réessayer dans quelques instants.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Accéder à mes podcasts';
      }
    }

    function showPlayer(email) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('welcome-text').textContent = `Bienvenue ! Accès confirmé pour ${email}`;
      document.getElementById('audiomeans-player').src = AUDIOMEANS_EMBED_URL;
      document.getElementById('player-area').style.display = 'block';
    }

    function logout() {
      localStorage.removeItem(SESSION_KEY);
      document.getElementById('audiomeans-player').src = '';
      document.getElementById('player-area').style.display = 'none';
      document.getElementById('gate').style.display = 'block';
      document.getElementById('email-input').value = '';
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = type;
    }

    document.getElementById('email-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') verifyEmail();
    });
  </script>
  <script src="/search-widget.js"></script>

</body>
</html>
